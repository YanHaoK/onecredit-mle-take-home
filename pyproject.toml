[project]
name = "company-recommendation-system"
version = "0.0.0"
description = "Turn a company event feed into a similar-companies service with RabbitMQ and pgvector."
requires-python = ">=3.14,<3.15"
dependencies = [
  "aio-pika",
  "fastapi>=0.165.0",
  "huggingface-hub>=2.4.0",
  "numpy>=2.5.5",
  "onnxruntime>=1.32.0",
  "psycopg[binary,pool]>=3.3.9",
  "tokenizers>=0.23.3",
  "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]
